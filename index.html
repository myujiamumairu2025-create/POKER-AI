<!-- ★★★ パート3：役判定・ショーダウン・ランキング・ルール表示 ★★★ -->

<script>
// --- 役判定（5枚評価） ---
function evaluateHand(cards) {
  const rv = {
    "A": 14, "K": 13, "Q": 12, "J": 11,
    "10": 10, "9": 9, "8": 8, "7": 7,
    "6": 6, "5": 5, "4": 4, "3": 3, "2": 2
  };

  const combos = getCombinations(cards, 5);
  let bestHand = null;

  for (const c of combos) {
    const evaluated = eval5(c, rv);
    if (!bestHand || compareHandArrays(evaluated.scoreArr, bestHand.scoreArr) > 0) {
      bestHand = evaluated;
    }
  }
  return bestHand;
}

// --- 7枚から5枚を選ぶ組み合わせ ---
function getCombinations(arr, k) {
  if (k === 0) return [[]];
  if (arr.length === 0) return [];

  const head = arr[0];
  const tail = arr.slice(1);

  const withHead = getCombinations(tail, k - 1).map(c => [head, ...c]);
  const withoutHead = getCombinations(tail, k);

  return [...withHead, ...withoutHead];
}

// --- 5枚の役判定 ---
function eval5(cards5, rv) {
  const rs = cards5.map(c => c.slice(0, -1));
  const ss = cards5.map(c => c.slice(-1));
  const vals = rs.map(r => rv[r]).sort((a, b) => b - a);

  const isFlush = ss.every(s => s === ss[0]);

  const uniq = [...new Set(vals)].sort((a, b) => b - a);
  let isStraight = false, straightHigh = 0;

  if (uniq.length === 5) {
    if (uniq[0] - uniq[4] === 4) {
      isStraight = true;
      straightHigh = uniq[0];
    } else if (uniq[0] === 14 && uniq[1] === 5 && uniq[2] === 4 && uniq[3] === 3 && uniq[4] === 2) {
      isStraight = true;
      straightHigh = 5;
    }
  }

  const counts = {};
  for (const v of vals) counts[v] = (counts[v] || 0) + 1;

  const countEntries = Object.entries(counts)
    .map(([v, c]) => ({ val: Number(v), count: c }))
    .sort((a, b) => b.count !== a.count ? b.count - a.count : b.val - a.val);

  let category = 0, name = "ハイカード";

  if (isStraight && isFlush) { category = 8; name = "ストレートフラッシュ"; }
  else if (countEntries[0].count === 4) { category = 7; name = "フォーカード"; }
  else if (countEntries[0].count === 3 && countEntries[1].count === 2) { category = 6; name = "フルハウス"; }
  else if (isFlush) { category = 5; name = "フラッシュ"; }
  else if (isStraight) { category = 4; name = "ストレート"; }
  else if (countEntries[0].count === 3) { category = 3; name = "スリーカード"; }
  else if (countEntries[0].count === 2 && countEntries[1].count === 2) { category = 2; name = "ツーペア"; }
  else if (countEntries[0].count === 2) { category = 1; name = "ワンペア"; }

  let scoreArr = [category];

  if (category === 8 || category === 4) {
    scoreArr.push(straightHigh);
  } else {
    for (const e of countEntries) scoreArr.push(e.val);
  }

  return { category, name, scoreArr };
}

// --- 役比較 ---
function compareHandArrays(a, b) {
  for (let i = 0; i < Math.max(a.length, b.length); i++) {
    const valA = a[i] || 0;
    const valB = b[i] || 0;
    if (valA !== valB) return valA - valB;
  }
  return 0;
}

// --- ストリート終了 ---
function endStreet() {
  actorIndex = 0;
  gameStep++;

  if (gameStep === 1) flop();
  else if (gameStep === 2) turn();
  else if (gameStep === 3) river();
  else showdown();
}

// --- FLOP ---
function flop() {
  community.push(deck.pop(), deck.pop(), deck.pop());
  showText("c1", community[0]);
  showText("c2", community[1]);
  showText("c3", community[2]);

  document.getElementById("status").innerHTML += "<br>--- FLOP ---";
  startStreet();
}

// --- TURN ---
function turn() {
  community.push(deck.pop());
  showText("c4", community[3]);

  document.getElementById("status").innerHTML += "<br>--- TURN ---";
  startStreet();
}

// --- RIVER ---
function river() {
  community.push(deck.pop());
  showText("c5", community[4]);

  document.getElementById("status").innerHTML += "<br>--- RIVER ---";
  startStreet();
}

// --- SHOWDOWN ---
function showdown() {
  if (!gameStarted && gameStep === 4) return;

  const board = [...community];
  const results = [];

  // プレイヤー
  if (playerActive) {
    const playerHand = evaluateHand([...player, ...board]);
    results.push({ name: "プレイヤー", active: true, hand: playerHand });

    playerStats.showdownCount++;

    const ev = cpuEV("P");
    if (ev < 0.25 && playerStats.postFlopBets > 0) {
      playerStats.bluffShowdowns++;
    }
    savePlayerStats();
  }

  // CPU
  for (const pos of ["LT","LB","RT","RB"]) {
    if (cpuState[pos].active) {
      results.push({
        name: "CPU_" + pos,
        active: true,
        hand: evaluateHand([...cpu[pos], ...board])
      });
    }
  }

  // 勝者判定
  let winners = [];
  for (const r of results) {
    if (winners.length === 0) {
      winners = [r];
    } else {
      const cmp = compareHandArrays(r.hand.scoreArr, winners[0].hand.scoreArr);
      if (cmp > 0) winners = [r];
      else if (cmp === 0) winners.push(r);
    }
  }

  // CPUカード公開
  for (const pos of ["LT","LB","RT","RB"]) {
    if (cpuState[pos].active) {
      showText("cpu" + pos, "CPU_" + pos + " (" + cpu[pos][0] + " " + cpu[pos][1] + ")");
    } else {
      showText("cpu" + pos, "CPU_" + pos + " FOLD");
    }
  }

  // 表示
  let msg = "<br>--- SHOWDOWN ---<br>";
  for (const r of results) {
    msg += r.name + "：" + r.hand.name + "<br>";
  }

  const share = Math.floor(pot / winners.length);
  msg += "<br>【勝者】 " + winners.map(w => w.name).join(", ") + " (獲得: " + share + "円)";

  // 賞金配分
  for (const w of winners) {
    if (w.name === "プレイヤー") {
      money += share;
    } else {
      const pos = w.name.replace("CPU_", "");
      cpuState[pos].stack += share;
    }
  }

  document.getElementById("status").innerHTML += msg;

  updateSessionBest();
  saveRankingRecord();

  pot = 0;
  currentBet = 0;
  updateMoney();
  updatePotDisplay();
  updateRaiseDisplay();

  gameStarted = false;
  gameStep = 4;
}

// --- セッション最高額更新 ---
let sessionBest = money;
function updateSessionBest() {
  if (money > sessionBest) sessionBest = money;
}

// --- Firebaseランキング保存 ---
function saveRankingRecord() {
  updateSessionBest();
  if (!playerName) return;

  const userRef = database.ref('rankings/level_' + cpuLevel + '/' + playerName);

  userRef.once('value', (snapshot) => {
    const currentData = snapshot.val();
    if (!currentData || sessionBest > currentData.money) {
      userRef.set({
        name: playerName,
        money: sessionBest,
        timestamp: Date.now()
      });
    }
  });
}

// --- ランキング表示 ---
function showRanking() {
  updateSessionBest();
  saveRankingRecord();

  document.getElementById("status").innerHTML = "オンラインランキングを取得中...";

  const levelRef = database.ref('rankings/level_' + cpuLevel);

  levelRef.orderByChild('money').limitToLast(10).once('value', (snapshot) => {
    let list = [];
    snapshot.forEach((childSnapshot) => {
      list.push(childSnapshot.val());
    });

    list.reverse();

    let html = "<h2>オンラインランキング (レベル " + cpuLevel + ")</h2>";
    if (list.length > 0) {
      list.forEach((r, i) => {
        html += (i + 1) + "位：" + r.name + " " + r.money + "円<br>";
      });
    } else {
      html += "まだこのレベルの記録はありません。";
    }
    document.getElementById("status").innerHTML = html;
  });
}

// --- ルール表示 ---
function showRules() {
  document.getElementById("status").innerHTML = `
  <h2>テキサスホールデム（このゲームのルール）</h2>
  ① 全員に2枚の手札と5枚のコミュニティカードが配られます<br>
  ② 各ラウンドで BET / RAISE / CALL / CHECK / FOLD を選択<br>
  ③ RAISE後は、他の参加者がそのベット額に合わせるまで同じラウンドを続行<br>
  ④ FLOP → TURN → RIVER の順に場札を公開<br>
  ⑤ RIVER後、残ったプレイヤーでSHOWDOWN<br>
  ⑥ 一番強い役のプレイヤーがポットを獲得<br>
  ⑦ 同じ強さならポットを分配
  `;
}

// --- 終了時にランキング保存 ---
window.addEventListener("beforeunload", () => {
  updateSessionBest();
  saveRankingRecord();
});
</script>
